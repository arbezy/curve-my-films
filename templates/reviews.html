{{if not .}}
  <p>No reviews yet.</p>
{{else}}
  <ul>
    {{range .}}
      <li class="review-item">
        <span class="review-info">
          <span class="review-title">{{.MovieName}}</span>
          <span class="review-date">Reviewed on {{.CreatedAt.Format "Jan 2, 2006"}}</span>
        </span>
        <span class="review-rating"><span class="rating-number" style="--rating: {{.Rating}}">{{.Rating}}</span>/10</span>
        <span class="review-actions">
          <button
            type="button"
            class="edit-btn"
            hx-get="/ui/edit-review?id={{.ReviewID}}"
            hx-target="#review-list"
            hx-swap="innerHTML"
            aria-label="Edit review for {{.MovieName}}"
          >edit</button>
          <button
            type="button"
            class="delete-btn"
            hx-delete="/ui/review?id={{.ReviewID}}"
            hx-target="closest li"
            hx-swap="delete"
            hx-confirm="Delete the review for &quot;{{.MovieName}}&quot;? This cannot be undone."
            aria-label="Delete review for {{.MovieName}}"
          >&times;</button>
        </span>
      </li>
    {{end}}
  </ul>
{{end}}
