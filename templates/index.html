<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Curve My Films</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --base:     #1e1e2e;
      --mantle:   #181825;
      --surface0: #313244;
      --surface1: #45475a;
      --surface2: #585b70;
      --text:     #cdd6f4;
      --subtext0: #a6adc8;
      --mauve:    #cba6f7;
      --pink:     #f5c2e7;
      --blue:     #89b4fa;
      --green:    #a6e3a1;
      --red:      #f38ba8;
    }

    body {
      font-family: sans-serif;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--base);
      color: var(--text);
    }

    h1 .word-1 { color: var(--mauve); }
    h1 .word-2 { color: var(--pink); }
    h1 .word-3 { color: var(--blue); }

    ul { padding-left: 1.2rem; }

    li {
      background: var(--surface0);
      border: 1px solid var(--surface1);
      border-radius: 0.4rem;
      padding: 0.5rem 0.8rem;
      margin-bottom: 0.4rem;
      list-style: none;
    }

    button {
      padding: 0.4rem 0.8rem;
      background: var(--mauve);
      color: var(--mantle);
      border: none;
      border-radius: 0.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: var(--subtext0); }

    label { display: block; margin-bottom: 0.6rem; }
    input {
      display: block;
      margin-top: 0.2rem;
      padding: 0.3rem 0.5rem;
      background: var(--surface0);
      border: 1px solid var(--surface1);
      border-radius: 0.3rem;
      color: var(--text);
    }

    .banner {
      padding: 0.6rem 0.9rem;
      border-radius: 0.4rem;
      margin: 0.8rem 0;
      font-weight: bold;
    }
    .banner-success { background: var(--green); color: var(--mantle); }
    .banner-error   { background: var(--red); color: var(--mantle); }

    ul.tree, ul.tree ul {
      list-style: none;
      padding-left: 1.2rem;
      border-left: 1px solid var(--surface2);
    }
    ul.tree { padding-left: 0; border-left: none; }
    ul.tree li { margin: 0.3rem 0; }
  </style>
</head>
<body>
  <h1><span class="word-1">Curve</span> <span class="word-2">My</span> <span class="word-3">Films</span></h1>

  <button hx-get="/ui/reviews" hx-target="#review-list" hx-swap="innerHTML">
    Load Reviews
  </button>

  <div id="review-list"></div>

  <hr>

  <button hx-get="/ui/add-review" hx-target="#add-review-panel" hx-swap="innerHTML">
    Add Review
  </button>

  <div id="add-review-panel"></div>
</body>
</html>
