<form hx-post="/ui/add-review/compare" hx-target="#add-review-panel" hx-swap="innerHTML">
  <label>
    Movie name
    <input type="text" name="movie_name" required>
  </label>
  <label>
    Rating
    <input type="number" name="rating" min="1" max="10" required>
  </label>
  <button type="submit">Start Ranking</button>
</form>
